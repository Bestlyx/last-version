e">Играть в «Глубину» бесплатно</a><a class="exit-return" href="./index.html">Остаться здесь</a></div></section></main><script>const hero = document.querySelector('.hero');
const artwork = document.querySelector('.hero-art img');
const positionLight = () => {
    if (!hero || !artwork)
        return;
    const { width, height } = artwork.getBoundingClientRect();
    const scale = Math.max(width / 1536, height / 1024);
    const position = getComputedStyle(artwork).objectPosition.split(' ').map(parseFloat);
    hero.style.setProperty('--lamp-x', `${1425 * scale + (width - 1536 * scale) * position[0] / 100}px`);
    hero.style.setProperty('--lamp-y', `${700 * scale + (height - 1024 * scale) * position[1] / 100}px`);
    hero.style.setProperty('--lamp-size', `${260 * scale}px`);
};
const resize = new ResizeObserver(positionLight);
if (hero)
    resize.observe(hero);
positionLight();
const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
let observer;
const elements = Array.from(document.querySelectorAll('[data-reveal]'));
const setup = () => {
    observer?.disconnect();
    elements.forEach(element => element.classList.remove('reveal-pending'));
    if (preference.matches || !('IntersectionObserver' in window))
        return;
    observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if (!entry.isIntersecting)
                return;
            entry.target.classList.remove('reveal-pending');
            observer?.unobserve(entry.target);
        });
    }, { threshold: 0.08, rootMargin: '0px 0px -24px 0px' });
    elements.forEach(element => {
        // Already-visible content stays visible, including anchor destinations.
        if (element.getBoundingClientRect().top < window.innerHeight)
            return;
        element.classList.add('reveal-pending');
        observer?.observe(element);
    });
};
const revealFocus = (event) => {
    const element = event.target.closest('[data-reveal]');
    element?.classList.remove('reveal-pending');
    if (element)
        observer?.unobserve(element);
};
setup();
preference.addEventListener('change', setup);
document.addEventListener('focusin', revealFocus);
</script></body></html>
